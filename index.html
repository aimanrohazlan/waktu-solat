<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waktu Solat</title>
  <meta name="description" content="Malaysian prayer times from JAKIM (e-solat.gov.my).">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Waktu Solat">
  <link rel="preload" href="fonts/Lora.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.4A7 7 0 1 1 15.5 3.5z"/></svg>
      Waktu Solat
    </span>
    <div class="seg" role="group" aria-label="Time format">
      <button type="button" data-fmt="24">24h</button>
      <button type="button" data-fmt="12">12h</button>
    </div>
  </header>

  <main class="layout">
    <div class="col">
      <section class="hero" id="hero" data-phase="night">
        <div class="sky" aria-hidden="true">
          <div class="stars"></div>
          <div class="orb"></div>
          <svg class="skyline" viewBox="0 0 400 90" preserveAspectRatio="xMidYMax slice">
            <path class="far" d="M0 90V70h30v-8h14v8h22V58c0-8 6-14 13-16 7 2 13 8 13 16v12h20v-6h12v6h34V44h3l2-14 2 14h3v26h18V62c0-14 10-25 22-30 12 5 22 16 22 30v8h16V48h3l2-12 2 12h3v22h26v-9h16v9h40v20z"/>
            <path class="near" d="M0 90V80h48V66h3l2-16 2 16h3v14h30v-6c0-10 8-18 17-21 9 3 17 11 17 21v6h40V60c0-20 15-36 33-42 18 6 33 22 33 42v20h34V66h3l2-16 2 16h3v14h40v-5c0-7 6-12 12-14 6 2 12 7 12 14v5h40v10z"/>
          </svg>
        </div>

        <div class="hero-body">
          <div class="zone-row">
            <label class="zone">
              <span class="sr-only">Zone</span>
              <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <select id="zone"></select>
            </label>
            <button type="button" id="locate" class="locate" aria-label="Use my location" title="Use my location">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
          </div>
          <p id="locate-msg" class="locate-msg" role="status" aria-live="polite" hidden></p>
          <h1 id="zone-name" class="zone-name"></h1>
          <p class="dates"><span id="greg"></span><span id="hijri"></span></p>

          <div id="status" class="status" role="status" aria-live="polite" hidden>
            <p id="status-text"></p>
            <button type="button" id="retry" class="retry" hidden>Retry</button>
          </div>

          <div id="countdown" class="ring-wrap" role="timer" aria-live="off" hidden>
            <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
              <circle class="ring-track" cx="120" cy="120" r="106"/>
              <circle class="ring-fill" id="ring-fill" cx="120" cy="120" r="106" pathLength="100"/>
            </svg>
            <div class="ring-text">
              <span id="cd-label" class="cd-label"></span>
              <span id="cd-time" class="cd-time"></span>
              <span id="cd-at" class="cd-at"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="glass times-card" id="times-card" hidden>
        <ol id="times" class="times"></ol>
      </section>
    </div>

    <section class="glass month" id="month-section" hidden>
      <h2 id="month-title"></h2>
      <div class="table-wrap">
        <table id="month-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="foot">Source: JAKIM (e-solat.gov.my)</footer>
</body>
</html>
